<svg xmlns="http://www.w3.org/2000/svg" width="680" height="322" viewBox="0 0 680 322" role="img">
  <title>World Youth Initiative Logo</title>

  <!-- Outer navy pentagon with rounded corners -->
  <polygon points="340,30 454,113 410,247 270,247 226,113"
    fill="#0B2A4A" stroke="#0B2A4A" stroke-width="28" stroke-linejoin="round"/>

  <!-- Inner white border -->
  <polygon points="340,48 437,119 400,233 280,233 243,119"
    fill="none" stroke="white" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- 4-pointed star -->
  <path d="M340,62 L343.5,72 L355,76 L343.5,80 L340,90 L336.5,80 L325,76 L336.5,72 Z" fill="white"/>

  <!-- Entablature bars -->
  <rect x="284" y="118" width="112" height="11" rx="3" fill="white"/>
  <rect x="292" y="132" width="96" height="7" rx="2" fill="white"/>

  <!-- Columns -->
  <rect x="288" y="142" width="14" height="82" rx="2" fill="white"/>
  <rect x="316" y="142" width="11" height="82" rx="2" fill="white"/>
  <rect x="353" y="142" width="11" height="82" rx="2" fill="white"/>
  <rect x="382" y="142" width="14" height="82" rx="2" fill="white"/>

  <!-- Arch outer (white) -->
  <path d="M327,224 L327,212 A12,12 0 0 1 353,212 L353,224 Z" fill="white"/>
  <!-- Arch inner (navy cutout) -->
  <path d="M331,224 L331,212 A8,8 0 0 1 349,212 L349,224 Z" fill="#0B2A4A"/>

  <!-- WORLD YOUTH text -->
  <text x="340" y="285"
    font-family="'Cinzel', 'Palatino Linotype', Georgia, serif"
    font-size="20" font-weight="700"
    fill="#0B2A4A" text-anchor="middle"
    letter-spacing="6">WORLD YOUTH</text>

  <!-- Divider line -->
  <line x1="240" y1="293" x2="440" y2="293" stroke="#3B82F6" stroke-width="0.8" opacity="0.5"/>

  <!-- INITIATIVE text -->
  <text x="340" y="312"
    font-family="'Cinzel', 'Palatino Linotype', Georgia, serif"
    font-size="11.5" font-weight="400"
    fill="#3B82F6" text-anchor="middle"
    letter-spacing="11">INITIATIVE</text>
</svg>
